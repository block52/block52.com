# DigitalOcean App Platform spec for the Block52 landing page (static site, no build step).
# Served at block52.xyz and www.block52.xyz (DNS is in DigitalOcean). block52.com can be
# added once it's redeemed and its nameservers point at DigitalOcean.
# Create:  doctl apps create --spec .do/app.yaml --project-id <b52 project id>
# Update:  doctl apps update <app id> --spec .do/app.yaml
name: block52-website
region: syd
static_sites:
  - name: web
    github:
      repo: block52/block52.com
      branch: main
      deploy_on_push: true
    source_dir: /
    index_document: index.html
    error_document: 404.html
domains:
  - domain: block52.xyz
    type: PRIMARY
    zone: block52.xyz
  - domain: www.block52.xyz
    type: ALIAS
    zone: block52.xyz
